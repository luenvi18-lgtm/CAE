{% extends "base.html" %}
{% from "_macros.html" import csrf, campos_equipo with context %}
{% block titulo %}Registrar equipo{% endblock %}
{% block contenido %}
<div class="card shadow-sm mx-auto" style="max-width: 640px">
  <div class="card-body p-4">
    <h1 class="h4 mb-3">Registrar equipo</h1>
    <form method="post" class="row g-3">
      {{ csrf() }}
      {{ campos_equipo(form) }}
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('usuario.mis_equipos') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
