{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="card shadow-sm mx-auto tarjeta-login">
  <div class="card-body p-4">
    <h1 class="h4 mb-1">Iniciar sesión</h1>
    <p class="text-muted small">Control de ingreso y salida de equipos</p>
    <form method="post">
      {{ csrf() }}
      <div class="mb-3">
        <label class="form-label" for="cedula">Cédula</label>
        <input class="form-control" id="cedula" name="cedula" inputmode="numeric" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
    <p class="mt-3 mb-0 text-center small">
      ¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}
